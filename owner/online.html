<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-панель — AM.DEV (для владельца)</title>
  <meta name="robots" content="noindex, nofollow">
  <script>(function(){try{var t=localStorage.getItem("amdev-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Служебная страница владельца: переиспользует дизайн-систему сайта */
    .owner-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .owner-top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1.25rem 0; border-bottom: 1px solid var(--line);
    }
    .owner-top .logo { text-decoration: none; }
    .owner-note { color: var(--text-mute); font-size: 0.78rem; font-family: var(--font-mono); }
    .owner-main { flex: 1; padding: 2.5rem 0 4rem; }
    .owner-title { font-size: clamp(1.6rem, 3vw, 2.4rem); }
    .owner-sub { color: var(--text-dim); margin-top: 0.6rem; max-width: 60ch; }
    .owner-grid { display: grid; gap: 1.5rem; margin-top: 2.25rem; }
    @media (min-width: 900px) { .owner-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
    .owner-card { background: var(--bg-2); border: 1px solid var(--line); padding: 1.5rem; border-radius: var(--radius); }
    .owner-card .eyebrow { margin-bottom: 1rem; }
    .owner-list { display: flex; flex-direction: column; }
    .owner-row {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.8rem 0; border-bottom: 1px dashed var(--line);
    }
    .owner-row:last-child { border-bottom: none; padding-bottom: 0; }
    .owner-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); flex-shrink: 0; }
    .owner-dot.is-online { background: var(--text); box-shadow: 0 0 0 1px var(--bg-2), 0 0 12px rgba(255,255,255,0.55); }
    .owner-name { flex: 1; font-size: 0.95rem; }
    .owner-meta { color: var(--text-mute); font-size: 0.8rem; font-family: var(--font-mono); }
    .owner-table { width: 100%; border-collapse: collapse; }
    .owner-table th, .owner-table td {
      text-align: left; padding: 0.55rem 0.4rem; font-size: 0.88rem;
      border-bottom: 1px dashed var(--line);
    }
    .owner-table th { color: var(--text-mute); font-weight: 500; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .owner-table td:first-child, .owner-table th:first-child { padding-left: 0; }
    .owner-empty { color: var(--text-mute); font-size: 0.9rem; }
    .owner-err { margin-top: 1.25rem; }
    .owner-foot-note { margin-top: 2rem; color: var(--text-mute); font-size: 0.78rem; font-family: var(--font-mono); }
    /* Экран входа — как в кабинете, но без большой hero-шапки */
    .owner-login-wrap { max-width: 420px; margin: 6vh auto 0; }
    .cab-login { background: none; border: none; padding: 0; }
  </style>
</head>
<body>
  <div class="container owner-shell">
    <div class="owner-top">
      <a href="../index.html" class="logo" aria-label="AM.DEV — на главную">[AM.DEV<span class="logo-caret" aria-hidden="true"></span>]</a>
      <span class="owner-note">// онлайн-панель · только для владельца</span>
    </div>

    <main class="owner-main">
      <div id="ownerApp" aria-live="polite">
        <div class="cab-loading"><span class="cab-loading-text">// загрузка…</span><span class="cab-caret" aria-hidden="true"></span></div>
      </div>
    </main>
  </div>

  <script src="../js/vendor/supabase.global.js"></script>
  <script src="../js/cabinet-config.js"></script>
  <script src="online.js"></script>
</body>
</html>
